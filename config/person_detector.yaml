person_detector:
  ros__parameters:
    # model_path is set by the launch file (installed models/ directory)
    backend: auto              # auto | tensorrt | onnxruntime
    engine_cache_dir: ""       # empty -> next to the .onnx file
    fp16: true                 # TensorRT only
    cpu_threads: 0             # ONNX Runtime only, 0 = default

    score_threshold: 0.1       # low on purpose: person_tracker uses 0.1-0.5 detections to keep tracks
    nms_threshold: 0.45        # only for models exported with an NMS head
    max_detections: 100
    class_ids: [0]             # COCO 0 = person

    image_topic: /camera/camera/color/image_raw
    publish_debug_image: false # detections/image for rqt_image_view
