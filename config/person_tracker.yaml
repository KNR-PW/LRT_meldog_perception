person_tracker:
  ros__parameters:
    # ByteTrack. person_detector must publish detections down to 0.1 (its
    # score_threshold): the weak ones keep partly occluded people tracked.
    high_threshold: 0.5        # main association; a new person needs high_threshold + 0.1
    match_threshold: 0.8       # max matching cost, 1 - IoU * score
    lost_timeout: 1.0          # seconds a hidden person keeps the ID

    publish_debug_image: false # tracks/image with IDs and velocity arrows
